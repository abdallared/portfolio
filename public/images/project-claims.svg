<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#141824" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c47d5b" />
      <stop offset="100%" stop-color="#e29578" />
    </linearGradient>

    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="480" y1="0" x2="480" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
  </g>

  <!-- Decorative Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="#c47d5b" opacity="0.07" filter="url(#glow)" />
  <circle cx="1000" cy="550" r="220" fill="#3b82f6" opacity="0.06" filter="url(#glow)" />

  <!-- Main Container / Header -->
  <rect x="60" y="50" width="1080" height="650" rx="16" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Top Bar -->
  <path d="M 60 66 Q 60 50 76 50 L 1124 50 Q 1140 50 1140 66 L 1140 110 L 60 110 Z" fill="#171c28" />
  <circle cx="95" cy="80" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="115" cy="80" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="135" cy="80" r="6" fill="#10b981" opacity="0.8" />
  
  <text x="175" y="85" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">Corporate Health Claims Management Platform</text>
  <rect x="940" y="66" width="170" height="28" rx="14" fill="rgba(196, 125, 91, 0.15)" stroke="rgba(196, 125, 91, 0.4)" stroke-width="1" />
  <text x="965" y="85" font-family="'JetBrains Mono', monospace" font-size="12" fill="#c47d5b" font-weight="600">FastAPI • Clean Arch</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <rect x="90" y="140" width="230" height="110" rx="12" fill="#1b212f" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="110" y="170" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Total Processed Claims</text>
  <text x="110" y="210" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#f8fafc" font-weight="700">$1,482,900</text>
  <text x="110" y="234" font-family="'Inter', sans-serif" font-size="11" fill="#10b981" font-weight="600">+14.2% this month</text>

  <!-- Card 2 -->
  <rect x="345" y="140" width="230" height="110" rx="12" fill="#1b212f" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="365" y="170" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Auto-Approval Rate</text>
  <text x="365" y="210" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#f8fafc" font-weight="700">96.4%</text>
  <text x="365" y="234" font-family="'Inter', sans-serif" font-size="11" fill="#60a5fa" font-weight="600">Rule Engine &amp; RBAC</text>

  <!-- Card 3 -->
  <rect x="600" y="140" width="230" height="110" rx="12" fill="#1b212f" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="620" y="170" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Active Companies &amp; Employees</text>
  <text x="620" y="210" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#f8fafc" font-weight="700">12,450</text>
  <text x="620" y="234" font-family="'Inter', sans-serif" font-size="11" fill="#c47d5b" font-weight="600">Multi-tenant policies</text>

  <!-- Card 4 -->
  <rect x="855" y="140" width="250" height="110" rx="12" fill="#1b212f" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="875" y="170" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Avg Async Task SLA</text>
  <text x="875" y="210" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#f8fafc" font-weight="700">1.2 sec</text>
  <text x="875" y="234" font-family="'Inter', sans-serif" font-size="11" fill="#34d399" font-weight="600">Redis + Celery queues</text>

  <!-- Main Chart / Claims Table Area -->
  <!-- Left Side: Interactive Chart Mockup -->
  <rect x="90" y="275" width="600" height="395" rx="12" fill="#171c28" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="120" y="315" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#f1f5f9" font-weight="600">Claims Volume &amp; Adjudication Analytics</text>
  
  <!-- Line Chart Graph Paths -->
  <path d="M 120 590 C 200 560, 260 480, 320 510 C 380 540, 440 420, 500 400 C 560 380, 620 430, 650 360" fill="none" stroke="url(#accent-grad)" stroke-width="3.5" />
  <path d="M 120 590 C 200 560, 260 480, 320 510 C 380 540, 440 420, 500 400 C 560 380, 620 430, 650 360 L 650 620 L 120 620 Z" fill="url(#accent-grad)" opacity="0.1" />

  <path d="M 120 610 C 190 590, 250 540, 330 570 C 410 600, 470 510, 530 480 C 590 450, 630 460, 650 430" fill="none" stroke="url(#blue-grad)" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Graph Points -->
  <circle cx="320" cy="510" r="5" fill="#c47d5b" stroke="#ffffff" stroke-width="2" />
  <circle cx="500" cy="400" r="5" fill="#c47d5b" stroke="#ffffff" stroke-width="2" />
  <circle cx="650" cy="360" r="6" fill="#e29578" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />

  <!-- Floating Data Tooltip -->
  <rect x="440" y="325" width="135" height="55" rx="8" fill="#1b212f" stroke="rgba(196, 125, 91, 0.5)" stroke-width="1.5" />
  <text x="452" y="348" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Aug 2026</text>
  <text x="452" y="367" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f8fafc" font-weight="700">$342,100 Claims</text>

  <!-- Right Side: Recent Claims Table -->
  <rect x="710" y="275" width="395" height="395" rx="12" fill="#171c28" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <text x="735" y="315" font-family="'Space Grotesk', sans-serif" font-size="17" fill="#f1f5f9" font-weight="600">Recent Claims Activity</text>

  <!-- Table Row 1 -->
  <rect x="735" y="340" width="345" height="68" rx="8" fill="#1f2636" />
  <text x="755" y="368" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f8fafc" font-weight="600">CLM-2026-0891</text>
  <text x="755" y="390" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Dr. Hassan Dental • General Dental</text>
  <rect x="990" y="358" width="75" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <text x="1006" y="374" font-family="'Inter', sans-serif" font-size="11" fill="#34d399" font-weight="600">APPROVED</text>

  <!-- Table Row 2 -->
  <rect x="735" y="420" width="345" height="68" rx="8" fill="#1f2636" />
  <text x="755" y="448" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f8fafc" font-weight="600">CLM-2026-0890</text>
  <text x="755" y="470" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Apex Hospital • Emergency Care</text>
  <rect x="990" y="438" width="75" height="24" rx="12" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
  <text x="1008" y="454" font-family="'Inter', sans-serif" font-size="11" fill="#60a5fa" font-weight="600">SETTLED</text>

  <!-- Table Row 3 -->
  <rect x="735" y="500" width="345" height="68" rx="8" fill="#1f2636" />
  <text x="755" y="528" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f8fafc" font-weight="600">CLM-2026-0889</text>
  <text x="755" y="550" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">City Pharma • Prescription Meds</text>
  <rect x="990" y="518" width="75" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
  <text x="1008" y="534" font-family="'Inter', sans-serif" font-size="11" fill="#fbbf24" font-weight="600">REVIEW</text>

  <!-- Table Row 4 -->
  <rect x="735" y="580" width="345" height="68" rx="8" fill="#1f2636" />
  <text x="755" y="608" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f8fafc" font-weight="600">CLM-2026-0888</text>
  <text x="755" y="630" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">ScanLabs • MRI Imaging</text>
  <rect x="990" y="598" width="75" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <text x="1006" y="614" font-family="'Inter', sans-serif" font-size="11" fill="#34d399" font-weight="600">APPROVED</text>
</svg>
